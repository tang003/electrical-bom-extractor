<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目管理 · 电气 BOM 工作台</title><style>
body{font:15px system-ui,-apple-system,sans-serif;background:#f4f7fb;color:#172338;margin:0}main{max-width:1000px;margin:40px auto;padding:0 24px}a{color:#2563eb}section{background:white;border:1px solid #dce4ee;border-radius:12px;padding:24px;margin:20px 0}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #e5ebf2;text-align:left}button,select{padding:8px 12px;border:1px solid #b9c6d5;border-radius:6px;background:white;font:inherit;cursor:pointer}button.danger{color:#b91c1c}#message{color:#b91c1c;min-height:24px}.history{padding:14px;background:#f8fafc;margin:8px 0;border-radius:8px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style></head><body><main><a href="/">← 返回工作台</a><h1>项目管理</h1><p>项目移入回收站后可恢复。恢复历史版本会生成新的版本记录。</p><section><h2>当前项目</h2><table><thead><tr><th>项目</th><th>所有者</th><th>操作</th></tr></thead><tbody id="projects"></tbody></table></section><section><h2>回收站</h2><table><thead><tr><th>项目</th><th>操作</th></tr></thead><tbody id="trash"></tbody></table></section><section id="history-section" hidden><h2 id="history-title">历史版本</h2><div id="history"></div></section><p id="message" role="alert"></p></main><script src="/assets/auth.js"></script><script>
const msg=document.querySelector('#message');let users=[],ownership=[];
async function api(url,opts){let r=await fetch(url,opts);let x=await r.json();if(!r.ok)throw Error(x.detail||'操作失败');return x}
async function post(url,payload){return api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined})}
function cell(text){let td=document.createElement('td');td.textContent=text;return td}
async function refresh(){try{let me=await api('/api/auth/me');let projects=await api('/api/projects'),trash=await api('/api/projects/trash');if(me.role==='admin'){users=await api('/api/auth/users');ownership=await api('/api/projects/ownership')}document.querySelector('#projects').replaceChildren(...projects.map(p=>{let tr=document.createElement('tr'),actions=cell('');actions.className='actions';let link=document.createElement('a');link.href='/?project='+encodeURIComponent(p.project_id);link.textContent='打开';let history=document.createElement('button');history.textContent='历史';history.onclick=()=>showHistory(p);let remove=document.createElement('button');remove.textContent='移入回收站';remove.className='danger';remove.onclick=async()=>{if(!confirm('将该项目移入回收站？'))return;try{await post(`/api/projects/${encodeURIComponent(p.project_id)}/trash`);refresh()}catch(e){msg.textContent=e.message}};actions.append(link,history,remove);if(me.role==='admin'){let select=document.createElement('select');for(let u of users.filter(u=>u.active)){let option=document.createElement('option');option.value=u.id;option.textContent=u.username;select.append(option)}select.value=ownership.find(o=>o.id===p.project_id)?.owner_id||'';let transfer=document.createElement('button');transfer.textContent='转交';transfer.onclick=async()=>{try{await post(`/api/projects/${encodeURIComponent(p.project_id)}/transfer`,{owner_id:select.value});refresh()}catch(e){msg.textContent=e.message}};actions.append(select,transfer)}tr.append(cell(p.project_name||p.pdf_filename),cell(ownership.find(o=>o.id===p.project_id)?.username||'本人'),actions);return tr}));document.querySelector('#trash').replaceChildren(...trash.map(p=>{let tr=document.createElement('tr'),actions=cell('');let button=document.createElement('button');button.textContent='恢复';button.onclick=async()=>{try{await post(`/api/projects/${encodeURIComponent(p.id)}/restore`);refresh()}catch(e){msg.textContent=e.message}};actions.append(button);tr.append(cell(p.name),actions);return tr}));}catch(e){msg.textContent=e.message}}
async function showHistory(p){try{let rows=await api(`/api/projects/${encodeURIComponent(p.project_id)}/revisions`);document.querySelector('#history-title').textContent='历史版本 · '+(p.project_name||p.pdf_filename);let section=document.querySelector('#history-section');section.hidden=false;document.querySelector('#history').replaceChildren(...rows.map(r=>{let box=document.createElement('div');box.className='history';let label=document.createElement('span');label.textContent=`版本 ${r.version} · ${r.summary} · ${new Date(r.created_at).toLocaleString()}`;let button=document.createElement('button');button.textContent='恢复此版本';button.style.marginLeft='12px';button.onclick=async()=>{if(!confirm('恢复此版本并生成新版本？'))return;try{let current=await api(`/api/projects/${encodeURIComponent(p.project_id)}`);await post(`/api/projects/${encodeURIComponent(p.project_id)}/revisions/${r.version}/restore`,{expected_version:current.data_version});msg.textContent='已恢复';refresh()}catch(e){msg.textContent=e.message}};box.append(label,button);return box}));section.scrollIntoView({behavior:'smooth'})}catch(e){msg.textContent=e.message}}
refresh();
</script></body></html>
