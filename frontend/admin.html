<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>账号管理 · 电气 BOM 工作台</title><style>
body{font:15px system-ui,-apple-system,sans-serif;background:#f4f7fb;color:#172338;margin:0}main{max-width:960px;margin:40px auto;padding:0 24px}h1{font-size:28px}section{background:white;border:1px solid #dce4ee;border-radius:12px;padding:24px;margin:20px 0}input,select{padding:9px;border:1px solid #b9c6d5;border-radius:6px;font:inherit}button{padding:9px 14px;border:0;border-radius:6px;background:#2563eb;color:white;cursor:pointer}button.secondary{background:#607086}button.danger{background:#b91c1c}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #e5ebf2;text-align:left}form{display:flex;gap:10px;flex-wrap:wrap}#message{color:#b91c1c;min-height:24px}a{color:#2563eb}
</style></head><body><main><a href="/">← 返回工作台</a><h1>账号管理</h1><p>管理员创建账号；员工首次登录必须修改密码。停用或重置会撤销原有登录。</p><section><h2>创建账号</h2><form id="create"><input name="username" placeholder="账号" required pattern="[a-zA-Z0-9_.-]+"><input name="password" type="password" placeholder="初始密码（至少 8 位）" minlength="8" required><select name="role"><option value="engineer">工程师</option><option value="admin">管理员</option></select><button>创建</button></form></section><section><h2>现有账号</h2><table><thead><tr><th>账号</th><th>角色</th><th>状态</th><th>操作</th></tr></thead><tbody id="users"></tbody></table></section><section><h2>项目回收站</h2><table><thead><tr><th>项目</th><th>操作</th></tr></thead><tbody id="trash"></tbody></table></section><p id="message" role="alert"></p></main><script src="/assets/auth.js"></script><script>
const message=document.querySelector('#message');
async function api(url,options){const r=await fetch(url,options);const x=await r.json();if(!r.ok)throw Error(x.detail||'操作失败');return x}
async function refresh(){try{const users=await api('/api/auth/users'),trash=await api('/api/projects/trash');document.querySelector('#users').replaceChildren(...users.map(u=>{let tr=document.createElement('tr');let name=document.createElement('td');name.textContent=u.username;let role=document.createElement('td');role.textContent=u.role;let state=document.createElement('td');state.textContent=u.active?'启用':'停用';let actions=document.createElement('td');let toggle=document.createElement('button');toggle.textContent=u.active?'停用':'启用';toggle.className=u.active?'danger':'secondary';toggle.onclick=()=>action(`/api/auth/users/${u.id}/active/${!u.active}`);let reset=document.createElement('button');reset.textContent='重置密码';reset.className='secondary';reset.style.marginLeft='8px';reset.onclick=()=>{let password=prompt('请输入新初始密码（至少 8 位）');if(password)action(`/api/auth/users/${u.id}/reset`,{password})};actions.append(toggle,reset);tr.append(name,role,state,actions);return tr}));document.querySelector('#trash').replaceChildren(...trash.map(p=>{let tr=document.createElement('tr');let name=document.createElement('td');name.textContent=p.name+' ('+p.id+')';let actions=document.createElement('td');let restore=document.createElement('button');restore.textContent='恢复';restore.onclick=()=>action(`/api/projects/${encodeURIComponent(p.id)}/restore`);actions.append(restore);tr.append(name,actions);return tr}));}catch(e){message.textContent=e.message}}
async function action(url,payload){try{await api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:payload?JSON.stringify(payload):undefined});message.textContent='操作已完成';refresh()}catch(e){message.textContent=e.message}}
document.querySelector('#create').onsubmit=async e=>{e.preventDefault();let data=Object.fromEntries(new FormData(e.target));try{await api('/api/auth/users',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});e.target.reset();message.textContent='账号已创建';refresh()}catch(e){message.textContent=e.message}};refresh();
</script></body></html>
