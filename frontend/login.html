<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>登录 · 电气 BOM 工作台</title><style>
body{font:16px system-ui,-apple-system,sans-serif;background:#eef3f8;color:#172338;min-height:100vh;display:grid;place-items:center;margin:0}.card{background:white;border-radius:16px;box-shadow:0 16px 40px #1c355522;padding:32px;width:min(400px,calc(100vw - 48px))}h1{font-size:24px;margin:0 0 8px}p{color:#627086;line-height:1.5}label{display:block;margin-top:18px;font-weight:600}input{box-sizing:border-box;width:100%;padding:12px;margin-top:6px;border:1px solid #b9c6d5;border-radius:8px;font:inherit}button{width:100%;padding:12px;margin-top:24px;border:0;border-radius:8px;background:#2563eb;color:white;font:inherit;cursor:pointer}#error{color:#b91c1c;min-height:1.5em;margin-top:14px}
</style></head><body><main class="card"><h1>电气 BOM 工作台</h1><p id="hint">使用管理员分配的账号登录。</p><form id="login"><label>账号<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><form id="change" hidden><label>当前密码<input name="old_password" type="password" autocomplete="current-password" required></label><label>新密码（至少 8 位）<input name="new_password" type="password" autocomplete="new-password" minlength="8" required></label><button>修改密码</button></form><div id="error" role="alert"></div></main><script src="/assets/auth.js"></script><script>
const login=document.querySelector('#login'),change=document.querySelector('#change'),error=document.querySelector('#error'),hint=document.querySelector('#hint');
function showChange(){login.hidden=true;change.hidden=false;hint.textContent='首次登录必须修改密码。修改后请用新密码重新登录。';}
if(new URLSearchParams(location.search).has('change'))showChange();
login.onsubmit=async e=>{e.preventDefault();error.textContent='';const data=Object.fromEntries(new FormData(login));const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await r.json();if(!r.ok){error.textContent=body.detail||'登录失败';return}if(body.must_change_password)showChange();else location.href='/';};
change.onsubmit=async e=>{e.preventDefault();error.textContent='';const data=Object.fromEntries(new FormData(change));const r=await fetch('/api/auth/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const body=await r.json();if(!r.ok){error.textContent=body.detail||'修改失败';return}location.href='/login';};
</script></body></html>
